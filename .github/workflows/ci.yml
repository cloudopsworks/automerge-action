name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "yarn"

      - name: install
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: lint
        run: yarn lint

      - name: test
        run: yarn test

      - name: compile
        run: yarn compile

      - name: verify dist is up to date
        run: |
          # --porcelain also catches files ncc newly emits (e.g. dist/package.json),
          # which `git diff` would miss while they are untracked
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ is out of date, run 'yarn compile' and commit the result"
            git status --porcelain -- dist
            exit 1
          fi
